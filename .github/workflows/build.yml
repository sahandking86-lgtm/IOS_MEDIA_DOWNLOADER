name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Downloads BeeWare's official iOS-compiled Python runtime and yt-dlp's
      # pure-Python source, before the Xcode project even exists, so the
      # Frameworks/ path XcodeGen and the archive step both reference is
      # already in place. See README.md "Native yt-dlp engine".
      - name: Fetch embedded Python + yt-dlp payload
        run: |
          set -e

          echo "Locating latest Python 3.11 iOS runtime release..."
          PY_URL=$(curl -s https://api.github.com/repos/beeware/Python-Apple-support/releases \
            | grep -o 'https://github.com/beeware/Python-Apple-support/releases/download/3\.11-[^"]*iOS-support[^"]*\.tar\.gz' \
            | head -n 1)
          echo "Using $PY_URL"

          curl -L -o python-ios-support.tar.gz "$PY_URL"
          mkdir -p Frameworks
          tar -xzf python-ios-support.tar.gz -C Frameworks
          ls Frameworks

          echo "Downloading yt-dlp..."
          mkdir -p Resources/ytdlp-site-packages
          python3 -m pip install --quiet --target Resources/ytdlp-site-packages yt-dlp --no-deps

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -archivePath build/VideoDownloader.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa from the archive
        run: |
          mkdir -p build/Payload
          cp -R "build/VideoDownloader.xcarchive/Products/Applications/VideoDownloader.app" build/Payload/
          cd build && zip -r VideoDownloader.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-ipa
          path: build/VideoDownloader.ipa
          retention-days: 14
