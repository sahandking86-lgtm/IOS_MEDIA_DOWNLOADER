name: VideoDownloader
options:
  bundleIdPrefix: com.enderwoman.videodownloader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO

packages:
  # Bridges CPython into Swift so the bundled yt-dlp (pure Python) can run
  # natively on-device. See README.md "Native yt-dlp engine" for setup.
  PythonKit:
    url: https://github.com/pvieito/PythonKit.git
    branch: main
  # NOTE: arthenica/ffmpeg-kit isn't distributed via Swift Package Manager
  # (no Package.swift in that repo — it ships via CocoaPods/Maven/npm only),
  # so it's been removed here. FFmpegService.swift is already stubbed to
  # reflect that FFmpeg isn't linked yet; see README.md for SPM-compatible
  # alternatives (e.g. kewlbear/FFmpeg-iOS) to wire in later.

targets:
  VideoDownloader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - package: PythonKit
      - framework: Frameworks/Python.xcframework
        embed: true
    postbuildScripts:
      - name: Install Python Standard Library
        # Modern Python-Apple-support releases (Python 3.13+ / PEP 730
        # packaging) ship the pure-Python standard library once, at
        # Python.xcframework/lib — separate from the compiled per-platform
        # framework slices, which Xcode already embeds automatically via
        # the `embed: true` framework dependency above. This copies that
        # shared lib/ folder into the app bundle so PYTHONHOME (set in
        # YTDLPEngine.swift) can find it at runtime.
        script: |
          set -e
          mkdir -p "${CODESIGNING_FOLDER_PATH}/python"
          rsync -a --delete "$PROJECT_DIR/Frameworks/Python.xcframework/lib" "${CODESIGNING_FOLDER_PATH}/python/"
        basedOnDependencyAnalysis: false
      - name: Install yt-dlp Package
        # Copied directly via rsync rather than declared as a XcodeGen
        # `resources:` entry — the generic Resources/ folder reference
        # wasn't reliably bundling this (confirmed missing from the built
        # app on-device), likely conflicting with Resources/Info.plist
        # also being used to generate the target's Info.plist. This uses
        # the same proven direct-copy approach as the Python stdlib above.
        script: |
          set -e
          rsync -a --delete "$PROJECT_DIR/PythonPackages/ytdlp-site-packages" "${CODESIGNING_FOLDER_PATH}/"
        basedOnDependencyAnalysis: false
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: "Used to save downloaded videos to your Photos library when you choose to export them."
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    entitlements:
      path: Resources/VideoDownloader.entitlements
      properties:
        com.apple.security.app-sandbox: false
