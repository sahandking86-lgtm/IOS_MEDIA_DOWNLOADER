name: VideoDownloader
options:
  bundleIdPrefix: com.enderwoman.videodownloader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO

packages:
  # Bridges CPython into Swift so the bundled yt-dlp (pure Python) can run
  # natively on-device. See README.md "Native yt-dlp engine" for setup.
  PythonKit:
    url: https://github.com/pvieito/PythonKit.git
    branch: main
  # NOTE: arthenica/ffmpeg-kit isn't distributed via Swift Package Manager
  # (no Package.swift in that repo — it ships via CocoaPods/Maven/npm only),
  # so it's been removed here. FFmpegService.swift is already stubbed to
  # reflect that FFmpeg isn't linked yet; see README.md for SPM-compatible
  # alternatives (e.g. kewlbear/FFmpeg-iOS) to wire in later.

targets:
  VideoDownloader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - package: PythonKit
      - framework: Frameworks/Python.xcframework
        embed: true
    postbuildScripts:
      - name: Install Python Runtime
        # Official BeeWare install step — copies the correct architecture's
        # Python standard library into the app bundle at build time. Must
        # run with dependency analysis off since it writes straight into
        # the product folder rather than declared outputs.
        script: |
          set -e
          source "$PROJECT_DIR/Frameworks/Python.xcframework/build/build_utils.sh"
          install_python Frameworks/Python.xcframework app
        basedOnDependencyAnalysis: false
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryAddUsageDescription: "Used to save downloaded videos to your Photos library when you choose to export them."
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    entitlements:
      path: Resources/VideoDownloader.entitlements
      properties:
        com.apple.security.app-sandbox: false
